[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "movieagent"
version = "1.0.0"
description = "Conversational movie discovery assistant over a filtered MovieLens subset"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
]

[project.optional-dependencies]
# Only needed for the LLM-planned backend (--backend openai|anthropic).
llm = ["openai>=1.40", "anthropic>=0.39"]

[tool.setuptools.packages.find]
where = ["src"]
